<!-- KATEGORİ / BİLGİ SAYFASI BAŞLIĞI. Ortak üst menü ve alt bölüm storefront.html'den gelir. -->
<main id="page-main">
  <section class="hero collection-page-intro" aria-labelledby="page-title">
    <div class="hero-copy collection-page-copy">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="/" data-en="Home" data-tr="Ana sayfa">Home</a>
        <span aria-hidden="true">/</span>
        <a href="/collections/all" data-en="Jewelry" data-tr="Takılar">Jewelry</a>
        <span aria-hidden="true">/</span>
        <span aria-current="page" data-en="{{TITLE_EN}}" data-tr="{{TITLE_TR}}">{{TITLE_EN}}</span>
      </nav>
      <span class="eyebrow" data-en="THE KİBELE COLLECTION" data-tr="KİBELE KOLEKSİYONU">
        THE KİBELE COLLECTION
      </span>
      <h1 id="page-title" data-en="{{TITLE_EN}}" data-tr="{{TITLE_TR}}">{{TITLE_EN}}</h1>
      <p data-en="{{DESCRIPTION_EN}}" data-tr="{{DESCRIPTION_TR}}">{{DESCRIPTION_EN}}</p>
    </div>
    <div class="hero-image">
      <img
        src="{{PAGE_IMAGE}}"
        alt="{{TITLE_EN}} — KİBELE"
        width="1000"
        height="700"
        fetchpriority="high"
      />
    </div>
  </section>
  <!-- PAGE_CONTENT -->
</main>
